[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hairguard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mediapipe",
    "opencv-python",
    "pystray",
    "Pillow",
    "pyyaml",
    "colorama",
    "plyer",
    # Runs the trained detector. It was previously listed only under the
    # `train` extra, which meant a plain `pip install hairguard` produced an
    # app that started normally, reported "модель недоступна" in one line of
    # console output, and then caught 53.9% of episodes instead of 86.7%.
    "onnxruntime",
]

[project.optional-dependencies]
wayland = ["PyGObject"]
# Dataset collection and the labelling UI (hairlab). The app itself runs
# without these; only `hairlab label` needs a web server.
lab = ["fastapi", "uvicorn"]
# Training the detector. onnx and onnxscript are needed by the exporter
# itself, not just to run the result — torch.onnx.export fails without them.
train = ["torch", "pytorch-lightning", "torchmetrics", "scikit-learn",
         "onnx", "onnxscript", "onnxruntime"]
# Building the double-clickable bundles. See bundle/build.py.
package = ["pyinstaller>=6.10"]

[project.scripts]
hairguard = "hairguard.entry:console_main"
hairlab = "hairlab.__main__:main"

[project.gui-scripts]
# No console window: the same thing the bundled HairGuard.exe is, for people
# who installed from source and want an icon to double-click.
hairguard-gui = "hairguard.entry:gui_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hairguard*", "hairlab*"]

[tool.setuptools.package-data]
"hairlab.server" = ["static/*"]
# A trained model ships with the package so detection works before the user
# has collected anything of their own.
"hairguard" = ["models/*"]
