[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hairguard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mediapipe",
    "opencv-python",
    "pystray",
    "Pillow",
    "pyyaml",
    "colorama",
    "plyer",
]

[project.optional-dependencies]
wayland = ["PyGObject"]
# Dataset collection and the labelling UI (hairlab). The app itself runs
# without these; only `hairlab label` needs a web server.
lab = ["fastapi", "uvicorn"]
# Training the detector. onnx and onnxscript are needed by the exporter
# itself, not just to run the result — torch.onnx.export fails without them.
train = ["torch", "pytorch-lightning", "torchmetrics", "scikit-learn",
         "onnx", "onnxscript", "onnxruntime"]

[project.scripts]
hairguard = "hairguard.cli:main"
hairlab = "hairlab.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hairguard*", "hairlab*"]

[tool.setuptools.package-data]
"hairlab.server" = ["static/*"]
# A trained model ships with the package so detection works before the user
# has collected anything of their own.
"hairguard" = ["models/*"]
